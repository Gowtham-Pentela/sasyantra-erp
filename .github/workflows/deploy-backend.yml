# Auto-redeploy backend to Cloud Run on every push to main.
# ponytail: builds the Dockerfile on the GitHub runner (native amd64), pushes to
# Artifact Registry, deploys. Auth is Workload Identity Federation — short-lived
# tokens via the GitHub OIDC provider, no long-lived keys, no GitHub secrets to paste.
# Frontend is deployed separately with `firebase deploy` (see PROJECT_CONTEXT.md §14).
name: Deploy backend to Cloud Run
on:
  push:
    branches: [main, deploy/free-stack]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

env:
  PROJECT_ID: kgf-foundry-06051646
  REGION: us-central1
  SERVICE: sasyantra-api
  REPO: us-central1-docker.pkg.dev/kgf-foundry-06051646/sasyantra
  WIF_PROVIDER: projects/962851079223/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: github-deployer@kgf-foundry-06051646.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMG=${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE=$IMG" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="$IMAGE" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi --cpu=1 --timeout=300 \
            --set-env-vars=JWT_ACCESS_EXPIRES=8h \
            --set-secrets=DATABASE_URL=sasyantra-db-url:latest,JWT_SECRET=sasyantra-jwt-secret:latest

      - name: Show URL
        run: echo "Live at $(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')"